<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="mural://app/widget-base.css"><script src="mural://app/widget-sdk.js"></script>
<style>
 body { display: grid; place-items: center; text-align: center; } #n { font: 200 clamp(30px, 34vmin, 90px)/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
 #u { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; } #w { font-weight: 600; margin-top: 6px; }
</style></head><body><div><div id="n">–</div><div id="u"></div><div id="w"></div></div>
<script>
function draw() { const st = mural.settings; document.documentElement.style.setProperty('--accent', st.accent || '#ffb36b'); w.textContent = st.what || '';
  const d = new Date((st.when || '') + 'T00:00'); if (isNaN(d)) { n.textContent = '?'; u.textContent = 'Set a date (YYYY-MM-DD)'; return; }
  const today = new Date(); today.setHours(0, 0, 0, 0); const days = Math.round((d - today) / 86400000);
  n.textContent = Math.abs(days); u.textContent = days === 0 ? 'Today!' : days > 0 ? (days === 1 ? 'day to go' : 'days to go') : (days === -1 ? 'day ago' : 'days ago'); }
mural.ready().then(draw); mural.on('settings', draw); mural.on('resume', draw); setInterval(() => { if (!mural.paused) draw(); }, 3600000);
</script></body></html>
