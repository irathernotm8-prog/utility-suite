<!doctype html>
<html><head><meta charset="utf-8"><title>Mural widgets</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' mural:; img-src 'self' mural: data:; style-src 'self' 'unsafe-inline'; frame-src mural:">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font: 12px -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
  #scrim { z-index: 1; position: fixed; inset: 0; background: rgba(6, 8, 14, .38); opacity: 0; transition: opacity .2s; pointer-events: none; }
  body.edit #scrim { opacity: 1; }
  .w { position: absolute; border-radius: 18px; transition: box-shadow .2s, transform .15s; }
  .w > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: inherit; background: transparent; color-scheme: normal; }
  .w.g-dark { background: rgba(14, 17, 26, .66); box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 18px 44px rgba(0,0,0,.35); }
  .w.g-light { background: rgba(246, 247, 251, .78); box-shadow: 0 0 0 1px rgba(255,255,255,.6) inset, 0 18px 44px rgba(0,0,0,.22); }
  .w.g-solid { background: #12151e; box-shadow: 0 0 0 1px rgba(255,255,255,.07) inset, 0 18px 44px rgba(0,0,0,.4); }
  .w.g-clear { background: transparent; }
  .shield { position: absolute; inset: 0; display: none; border-radius: inherit; cursor: grab; outline: 1.5px dashed rgba(170, 160, 255, .9); outline-offset: 3px; }
  body.edit .shield { display: block; }
  body.edit .w { animation: wob .32s ease-in-out infinite alternate; }
  body.edit .w.drag { animation: none; cursor: grabbing; box-shadow: 0 30px 70px rgba(0,0,0,.5); z-index: 99999 !important; }
  @keyframes wob { from { transform: rotate(-.25deg); } to { transform: rotate(.25deg); } }
  .bar { position: absolute; top: -14px; right: -10px; display: none; gap: 6px; }
  body.edit .bar { display: flex; }
  .bar button { width: 26px; height: 26px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: #f2f3f8; color: #111; box-shadow: 0 4px 14px rgba(0,0,0,.4); font: 600 13px system-ui; }
  .bar button.x { background: #ff5a6e; color: #fff; }
  .label { position: absolute; left: 0; right: 0; bottom: -24px; text-align: center; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.7); display: none; white-space: nowrap; }
  body.edit .label { display: block; }
  .grip { position: absolute; right: -6px; bottom: -6px; width: 18px; height: 18px; border-radius: 6px; background: #f2f3f8; box-shadow: 0 2px 8px rgba(0,0,0,.4); cursor: nwse-resize; display: none; }
  body.edit .w.rs .grip { display: block; }
  #done { z-index: 100000; position: fixed; top: 46px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 99px; background: rgba(22, 25, 36, .92); box-shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1) inset; font-size: 13px; }
  body.edit #done { display: flex; }
  #done button { border: 0; border-radius: 99px; padding: 7px 16px; background: linear-gradient(135deg, #7d6bff, #4fa3ff); color: #fff; font: 600 13px system-ui; cursor: pointer; }
  #empty { z-index: 100000; position: fixed; inset: 0; display: none; place-items: center; font-size: 15px; color: rgba(255,255,255,.85); text-shadow: 0 2px 10px rgba(0,0,0,.6); pointer-events: none; }
  body.edit.none #empty { display: grid; }
</style></head>
<body><div id="scrim"></div><div id="layer"></div>
<div id="done"><span>Drag widgets to move them · corner to resize · <b>Esc</b> when finished</span><button id="doneBtn">Done</button></div>
<div id="empty">Add widgets from Mural’s Widgets page — they’ll appear here.</div>
<script type="module" src="./widgets.js"></script></body></html>
