<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Waypoint booking</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { background: var(--bg-side); overflow: hidden; }
    body { opacity: 1; }
    .bar { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
    html.mac .bar { padding-left: 86px; } html.win .bar { padding-right: 150px; }
    .bar > * { -webkit-app-region: no-drag; }
    .addr { flex: 1; min-width: 120px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); color: var(--fg-2); font-size: 12.5px; -webkit-app-region: drag; }
    .addr b { color: var(--fg); font-weight: 600; } .addr .ellip { flex: 1; }
    .addr .ic { color: var(--ok); flex: none; }
    .sites { display: flex; gap: 2px; } .sites button { height: 28px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent; color: var(--fg-2); font-size: 12.5px; font-weight: 550; white-space: nowrap; }
    .sites button:hover { background: var(--panel-2); color: var(--fg); } .sites button.on { background: color-mix(in srgb, var(--acc) 14%, var(--panel-2)); color: var(--fg); }
    .trip { font-size: 11.5px; color: var(--mut); white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
    #save.found { animation: glow 1.6s ease-in-out infinite; }
    @keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--acc) 30%, transparent), 0 6px 18px color-mix(in srgb, var(--acc) 24%, transparent); } }
    .spin { color: var(--acc); }
    @media (max-width: 1100px) { .sites { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <button class="icon-btn sm" id="back" title="Back"><span data-icon="back" data-size="17"></span></button>
    <button class="icon-btn sm" id="fwd" title="Forward"><span data-icon="chevron" data-size="17"></span></button>
    <button class="icon-btn sm" id="rel" title="Reload"><span data-icon="refresh" data-size="16"></span></button>
    <div class="addr" id="addr"></div>
    <div class="sites" id="sites"></div>
    <button class="icon-btn sm" id="ext" title="Open in your browser"><span data-icon="external" data-size="16"></span></button>
    <span class="trip" id="trip"></span>
    <button class="btn primary sm" id="save" title="Save this page and the booking to your trip"><span data-icon="download" data-size="14"></span><span id="saveTxt">Save to trip</span></button>
  </div>
  <script src="icons.js"></script>
  <script src="browser-bar.js"></script>
</body>
</html>
