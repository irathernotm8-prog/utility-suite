<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Scene Switcher</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { background: transparent !important; }
  body { padding: 14px; }
  .sw { background: color-mix(in srgb, var(--elev) 94%, transparent); border: 1px solid var(--line-3); border-radius: 18px; box-shadow: 0 24px 70px rgba(0,0,0,.45); overflow: hidden; backdrop-filter: blur(30px); }
  .sw-q { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .sw-q input { flex: 1; border: 0; outline: none; background: none; font-size: 16px; color: var(--fg); }
  .sw-q .ic { color: var(--mut); }
  .sw-list { max-height: 300px; overflow: auto; padding: 6px; }
  .sw-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 22px; gap: 12px; align-items: center; height: 48px; padding: 0 10px; border-radius: 11px; cursor: pointer; }
  .sw-row.on { background: color-mix(in srgb, var(--c) 14%, transparent); }
  .sw-row .gl { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); }
  .sw-row b { font-size: 14px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw-row span.s { font-size: 12px; color: var(--mut); }
  .sw-row .n { font-size: 11.5px; color: var(--mut); text-align: center; font-weight: 600; }
  .sw-row .act { width: 7px; height: 7px; border-radius: 50%; background: var(--c); justify-self: center; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
  .sw-foot { display: flex; gap: 14px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--mut); }
  .sw-foot .kbd { height: 18px; font-size: 10.5px; }
  .sw-foot .grow { flex: 1; }
  .hud { padding: 18px 20px; }
  .hud-h { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .hud-h .gl { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); }
  .hud-h b { font-size: 16px; display: block; } .hud-h span { font-size: 12.5px; color: var(--mut); }
  .empty { padding: 30px; }
</style>
</head>
<body>

<div class="sw" id="sw"></div>
