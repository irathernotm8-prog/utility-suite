<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: fdfile:; media-src fdfile:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'">
<title>Fresh Desk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Places">
    <div class="side-top drag"></div>
    <nav id="places"></nav>
    <div class="side-foot">
      <button id="sideTidy" class="side-action" title="Tidy this folder"><span class="ic" data-icon="sparkle"></span>Tidy</button>
      <button id="sideSettings" class="side-action icon-only" title="Settings" aria-label="Settings"><span class="ic" data-icon="gear"></span></button>
    </div>
  </aside>
  <div class="resizer" id="sideResizer" aria-hidden="true"></div>

  <main id="main">
    <header id="toolbar" class="drag">
      <div class="nav-buttons no-drag">
        <button class="tb" id="back" title="Back" aria-label="Back"><span class="ic" data-icon="back"></span></button>
        <button class="tb" id="forward" title="Forward" aria-label="Forward"><span class="ic" data-icon="forward"></span></button>
      </div>
      <div id="crumbs" class="no-drag" role="navigation" aria-label="Path"></div>
      <input id="pathInput" class="no-drag" hidden spellcheck="false" aria-label="Go to folder">
      <div class="tb-group no-drag">
        <label class="search no-drag"><span class="ic" data-icon="search"></span><input id="search" type="search" placeholder="Search" spellcheck="false" aria-label="Search"><button id="deepToggle" class="chip" title="Search subfolders too">This folder</button></label>
        <div class="seg" role="radiogroup" aria-label="View">
          <button class="tb" data-view="list" title="List" aria-label="List view"><span class="ic" data-icon="list"></span></button>
          <button class="tb" data-view="grid" title="Grid" aria-label="Grid view"><span class="ic" data-icon="grid"></span></button>
          <button class="tb" data-view="columns" title="Columns" aria-label="Column view"><span class="ic" data-icon="columns"></span></button>
        </div>
        <button class="tb" id="tbTerminal" title="Open in Terminal (⌃`)" aria-label="Open in Terminal"><span class="ic" data-icon="terminal"></span></button>
        <button class="tb" id="tbPreview" title="Show preview" aria-label="Toggle preview"><span class="ic" data-icon="preview"></span></button>
        <button class="tb" id="tbMore" title="More" aria-label="More"><span class="ic" data-icon="more"></span></button>
      </div>
    </header>
    <div id="tabs" role="tablist" hidden></div>

    <div id="body">
      <section id="content" tabindex="0" aria-label="Files"></section>
      <div class="resizer" id="previewResizer" aria-hidden="true"></div>
      <aside id="preview" aria-label="Preview"></aside>
      <section id="tidy" hidden aria-label="Tidy"></section>
    </div>
    <footer id="status"><span id="statusLeft"></span><span id="statusRight"></span><input id="zoom" type="range" min="64" max="192" step="8" aria-label="Icon size" hidden></footer>
  </main>
</div>

<div id="quicklook" hidden role="dialog" aria-modal="true" aria-label="Quick Look"></div>
<div id="palette" hidden role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="palette-box"><input id="paletteInput" placeholder="Go to folder, run a command…" spellcheck="false" autocomplete="off"><div id="paletteList" role="listbox"></div><div class="palette-hint"><span>↑↓ to move</span><span>↵ to run</span><span>esc to close</span></div></div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="settingsDialog"></dialog>
<dialog id="tidyDialog"></dialog>

<script src="util.js"></script>
<script src="icons.js"></script>
<script src="review-model.js"></script>
<script src="app.js"></script>
<script src="tidy.js"></script>
</body>
</html>
