<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Docket</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 12.5px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  .pill { position: absolute; inset: 4px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; border-radius: 999px; color: #f3ede4;
    background: rgba(24,21,18,.86); border: 1px solid rgba(255,240,220,.14); backdrop-filter: blur(18px) saturate(1.4); -webkit-app-region: drag; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff5247; flex: none; animation: p 1.6s ease-in-out infinite; }
  .paused .dot { animation: none; background: #8b8378; }
  @keyframes p { 0%,100% { box-shadow: 0 0 0 0 rgba(255,82,71,.6); } 50% { box-shadow: 0 0 0 5px rgba(255,82,71,0); } }
  .time { font: 600 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; flex: none; }
  .line { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: rgba(243,237,228,.62); font-size: 12px; }
  button { -webkit-app-region: no-drag; width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: #f3ede4; display: grid; place-items: center; cursor: pointer; flex: none; }
  button:hover { background: rgba(255,255,255,.12); }
  button.stop { background: #ff5247; color: #fff; } button.stop:hover { filter: brightness(1.1); }
  svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .stop svg { fill: currentColor; stroke: none; }
</style>
</head>
<body>
<div class="pill" id="pill">
  <span class="dot"></span><span class="time" id="time">0:00</span><span class="line" id="line">Listening…</span>
  <button id="pause" title="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <button id="mark" title="Mark this moment"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></button>
  <button id="open" title="Open Docket"><svg viewBox="0 0 24 24"><path d="M14.5 4.5h5v5M19.5 4.5l-6 6M9.5 19.5h-5v-5M4.5 19.5l6-6"/></svg></button>
  <button id="stop" class="stop" title="Stop and summarize"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg></button>
</div>
<script src="bar.js"></script>
</body>
</html>
