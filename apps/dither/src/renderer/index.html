<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src blob: file:">
  <title>Dither</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <aside id="side">
      <div class="side-drag"></div>
      <div class="brand"><img src="../../build/icon.png" alt=""><div><b>Dither</b><span>Pixel studio</span></div></div>
      <button id="projBtn" class="proj-btn"><span class="proj-dot"></span><span class="grow ellip" id="projName">Project</span><span data-icon="chevronDown" data-size="14"></span></button>
      <nav id="nav">
        <button data-view="drafts" class="on"><span class="nav-ic" data-icon="drafts"></span>Drafts<span class="nav-count" id="draftCount"></span></button>
        <button data-view="effects"><span class="nav-ic" data-icon="effects"></span>Effects<span class="nav-count" id="effectCount"></span></button>
        <button data-view="sprites"><span class="nav-ic" data-icon="sprites"></span>Sprites<span class="nav-count" id="spriteCount"></span></button>
        <button data-view="animate"><span class="nav-ic" data-icon="film"></span>Animate<span class="nav-count" id="clipCount"></span></button>
        <button data-view="refs"><span class="nav-ic" data-icon="refs"></span>References<span class="nav-count" id="refCount"></span></button>
        <button data-view="tiles"><span class="nav-ic" data-icon="tiles"></span>Tiles &amp; scenes<span class="nav-count" id="sceneCount"></span></button>
        <button data-view="characters"><span class="nav-ic" data-icon="person"></span>Characters<span class="nav-count" id="charCount"></span></button>
        <div class="nav-sep"></div>
        <button data-view="library"><span class="nav-ic" data-icon="book"></span>Starter effects</button>
        <button data-view="make"><span class="nav-ic" data-icon="make"></span>Generate &amp; pixelize</button>
        <div class="nav-sep"></div>
        <button data-view="connections"><span class="nav-ic" data-icon="plug"></span>Connections<span class="nav-dot" id="aiDot"></span></button>
        <button data-view="settings"><span class="nav-ic" data-icon="gear"></span>Settings</button>
      </nav>
      <div class="side-fill"></div>
      <div id="aiCard" class="ai-card"></div>
    </aside>
    <main id="main">
      <header id="head"><div id="headLeft"></div><div id="headRight"></div></header>
      <section id="view"></section>
    </main>
  </div>
  <div id="sheetHost"></div>
  <div id="popHost"></div>
  <div id="toasts"></div>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="player.js"></script>
  <script src="drafts.js"></script>
  <script src="effects.js"></script>
  <script src="sprites.js"></script>
  <script src="editor.js"></script>
  <script src="refs.js"></script>
  <script src="make.js"></script>
  <script src="animate.js"></script>
  <script src="tiles.js"></script>
  <script src="characters.js"></script>
  <script src="more.js"></script>
  <script src="boot.js"></script>
</body>
</html>
