<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Onward</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="rail">
      <div class="brand drag">
        <div class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 22 L16 12 L26 22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 15 L16 5 L26 15" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/></svg></div>
        <span>Onward</span>
      </div>
      <nav class="nav" id="nav">
        <button data-view="jobs"><i data-icon="board"></i>Jobs<span class="count" id="navJobs"></span></button>
        <button data-view="discover"><i data-icon="search"></i>Discover</button>
        <button data-view="browser"><i data-icon="globe"></i>Browser</button>
        <button data-view="profile"><i data-icon="person"></i>Profile</button>
        <button data-view="settings"><i data-icon="plug"></i>Connect AI</button>
      </nav>
      <div class="rail-ai"><button class="btn ai-toggle" id="aiToggle" title="AI panel (⌘J)"><i data-icon="spark"></i><span id="aiToggleLabel">Ask AI</span><span class="kbd">⌘J</span></button></div>
      <div class="rail-foot">
        <div class="claude-card" id="claudeCard"></div>
        <div class="activity" id="activity"></div>
      </div>
    </aside>
    <main class="main">
      <section class="view" id="view-jobs"></section>
      <section class="view" id="view-discover"></section>
      <section class="view" id="view-browser"></section>
      <section class="view" id="view-profile"></section>
      <section class="view" id="view-settings"></section>
    </main>
    <aside class="ai-dock" id="aiDock"></aside>
  </div>
  <div class="hidden-tabs" id="hiddenTabs" aria-hidden="true"></div>
  <div class="drawer-scrim" id="scrim"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="modal-host" id="modal"></div>
  <div class="toasts" id="toasts"></div>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="ai.js"></script>
  <script src="jobs.js"></script>
  <script src="people.js"></script>
  <script src="discover.js"></script>
  <script src="browser.js"></script>
  <script src="guide.js"></script>
  <script src="profile.js"></script>
  <script src="settings.js"></script>
</body>
</html>
