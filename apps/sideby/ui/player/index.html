<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src * blob: data:; connect-src *; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src * data:">
<title>Sideby Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f1f4ee; font: 14px -apple-system, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  video { width: 100%; height: 100%; display: block; background: #000; outline: none; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 32px; pointer-events: none; }
  #msg div { max-width: 460px; background: rgba(12,16,13,.82); border: 1px solid rgba(212,240,138,.18); border-radius: 14px; padding: 18px 22px; line-height: 1.5; }
  #msg strong { display: block; font-size: 15px; margin-bottom: 4px; }
  #msg[hidden] { display: none; }
</style>
</head>
<body>
<video id="v" controls playsinline autoplay></video>
<div id="msg" hidden><div><strong id="msg-title"></strong><span id="msg-body"></span></div></div>
<script src="hls.min.js"></script>
<script src="player.js"></script>
</body>
</html>
