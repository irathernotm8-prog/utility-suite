<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="tb-left"><span class="brand"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="17" width="14" height="4" rx="2" fill="#8da2ff"/><rect x="7" y="12" width="10" height="4" rx="2" fill="#6ee7c8"/><rect x="9" y="7.5" width="6" height="3.5" rx="1.75" fill="#fff"/><circle cx="12" cy="4" r="2" fill="#8da2ff"/></svg>Lumen</span></div>
    <div class="tb-mid"><select id="ws" aria-label="Workspace"></select></div>
    <div class="tb-right"></div>
  </header>
  <nav id="rail">
    <button data-view="overview" class="on"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg><span>Overview</span></button>
    <button data-view="analytics"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9v9z"/></svg><span>Analytics</span></button>
    <button data-view="connections"><svg viewBox="0 0 24 24"><path d="M9 7V3m6 4V3M7 7h10v4a5 5 0 0 1-10 0V7zm5 9v5" /></svg><span>Sources</span></button>
    <button data-view="guide"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M9 8h6"/></svg><span>Guide</span></button>
    <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Settings</span></button>
    <div class="grow"></div>
    <button id="askBtn" class="accent"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span>Ask</span></button>
  </nav>
  <main id="main"></main>
  <aside id="ask" hidden>
    <div class="ask-head"><strong>Ask Lumen</strong><button id="askClose" class="ghost" aria-label="Close">✕</button></div>
    <div id="askLog"></div>
    <form id="askForm"><textarea id="askInput" rows="2" placeholder="Why did cost per lead jump last week?"></textarea><button class="primary">Send</button></form>
  </aside>
</div>
<div id="toast" role="status"></div>
<script src="charts.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
</body>
</html>
